<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turn a photograph into an interactive depth scene with MoGe-2, running locally in your browser with the Kaminos WebGPU Inference Kit.">
  <title>MoGe | A photograph, with depth</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <header>
    <a class="brand" href="./">MoGe<span>by Kaminos</span></a>
    <nav aria-label="Project"><a href="https://github.com/lyonsno/kaminos/tree/main/webgpu-inference-kit">Inference Kit <i data-lucide="arrow-up-right"></i></a><a href="https://github.com/lyonsno/moge-webgpu" aria-label="Source on GitHub" title="Source on GitHub"><i data-lucide="code-xml"></i></a></nav>
  </header>
  <main>
    <section class="workspace" aria-label="Interactive photograph">
      <div class="scene" id="drop-zone">
        <canvas id="photo-canvas" tabindex="0" aria-label="Photograph depth scene. Arrow keys move the camera or light; Home resets the view."></canvas>
        <div class="scene-heading"><h1>A photograph,<br> with depth.</h1><span id="scene-state">Original photograph</span></div>
        <div id="scene-caption"><span id="displayed-name">Celebration</span><span id="result-detail">MoGe-2 / WebGPU</span></div>
        <div class="drop-overlay">Open photograph</div>
      </div>
      <aside>
        <section id="photograph-section" aria-labelledby="photograph-title">
        <div class="section-title"><h2 id="photograph-title">Photograph</h2></div>
        <button id="upload-button" class="upload"><img id="selected-image" src="/test_fixtures/input.png" alt="Selected photograph"><span><strong id="selected-name">Celebration</strong><span>Choose photograph</span></span><i data-lucide="image-plus"></i></button>
        <input type="file" id="file-input" accept="image/*" hidden>
        <button id="sample-button" class="text-button">Use example</button>
        <button id="run-button" class="primary" disabled><i data-lucide="scan"></i><span>Reveal depth</span></button>
        <div class="run-state"><span id="status" role="status" aria-live="polite">Loading photograph</span><progress id="progress" hidden></progress><span id="elapsed"></span></div>
        <div id="error" role="alert" hidden></div>
        </section>
        <section id="explore-section" aria-labelledby="explore-title">
        <div class="section-title"><h2 id="explore-title">Explore</h2></div>
        <fieldset id="explore-controls" disabled>
          <legend class="sr-only">Scene controls</legend>
          <div class="segmented" aria-label="Interaction"><button data-tool="move" aria-pressed="true" title="Move camera"><i data-lucide="move-3d"></i>Move</button><button data-tool="light" aria-pressed="false" title="Move light"><i data-lucide="sun"></i>Relight</button></div>
          <label class="zoom-label" for="zoom">Zoom <output id="zoom-value">1.00x</output></label>
          <input id="zoom" type="range" min="0.67" max="1.43" step="0.01" value="1">
          <div class="view-row"><label for="view">View</label><select id="view"><option value="photo">Photograph + depth</option><option value="original">Original photograph</option><option value="depth">Depth map</option><option value="normals">Surface normals</option></select><button id="reset" class="icon-button" title="Reset camera and light" aria-label="Reset camera and light"><i data-lucide="rotate-ccw"></i></button></div>
        </fieldset>
        </section>
        <div class="model-info"><span class="dot"></span><span>MoGe-2 ViT-Large<span>Local WebGPU inference</span></span></div>
      </aside>
    </section>
  </main>
  <footer><span>Kaminos WebGPU Inference Kit</span><span>Depth &amp; surface normals from one image</span></footer>
  <pre id="debug-output" hidden></pre>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
